name: E2E CI

on:
  pull_request:
    branches: [main, development]

jobs:
  playwright:
    name: Playwright · register + login
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      # Backend bind + URLs the suite hits.
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://localhost:5073
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"

      # Postgres + Cosmos point at the docker-compose.db.yml services on localhost.
      ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=collab_dev;Username=postgres;Password=postgres"
      CosmosDb__AccountEndpoint: "https://localhost:8081/"
      CosmosDb__AccountKey: "C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw=="

      # Auth signing key fallback. appsettings.Development.json provides one too;
      # this guarantees the >=32-byte minimum even if config is overridden.
      AUTH_SIGNING_KEY: "ci-e2e-only-auth-signing-key-32-byte-minimum"

      # SendGrid options are validated at startup (ValidateOnStart) and require a
      # non-empty ApiKey, so the backend won't boot without one. The suite never
      # delivers mail — registration's verification-email send fails gracefully —
      # so a placeholder is sufficient here.
      SendGrid__ApiKey: "ci-e2e-placeholder-sendgrid-api-key"

      # Frontend → backend proxy target at runtime.
      API_URL: "http://localhost:5073"

      # Suite knobs.
      BASE_URL: "http://localhost:3000"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      # ----- Backing services -------------------------------------------------
      # Cosmos emulator on amd64 takes ~3-5 minutes to become reachable; start
      # it as early as possible so it can warm up while we build the apps.
      - name: Start Postgres + Cosmos emulator
        run: docker compose -f docker-compose.db.yml up -d

      # ----- Backend ----------------------------------------------------------
      - name: Restore backend
        run: dotnet restore backend/backend.csproj

      - name: Build backend
        run: dotnet build backend/backend.csproj --no-restore --configuration Release

      # ----- Frontend ---------------------------------------------------------
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ----- E2E deps + Playwright browsers ----------------------------------
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        # Follows Playwright's recommended CI pattern — no manual cache step
        # (their docs explicitly advise against caching browsers since cache
        # restore time is comparable to download time, and OS deps can't be
        # cached). The job's 30-min cap keeps a stuck install bounded.
        run: npx playwright install --with-deps chromium

      # ----- Wait for backing services to be ready ---------------------------
      - name: Wait for Postgres
        run: |
          timeout 120 bash -c '
            until docker compose -f docker-compose.db.yml exec -T db pg_isready -U postgres > /dev/null 2>&1; do
              sleep 2
            done
          '

      - name: Wait for Cosmos emulator
        run: |
          echo "Waiting for Cosmos emulator (typical: 3-5 minutes on amd64)..."
          timeout 600 bash -c '
            until curl -k --silent --output /dev/null --max-time 5 https://localhost:8081/_explorer/emulator.pem; do
              sleep 5
            done
          '

      # ----- Start backend + frontend in the background ----------------------
      - name: Start backend
        run: |
          nohup dotnet run --no-build --configuration Release --project backend \
            > backend.log 2>&1 &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for backend /health
        run: |
          timeout 180 bash -c '
            until curl --silent --fail http://localhost:5073/health > /dev/null; do
              sleep 2
            done
          '

      - name: Start frontend
        working-directory: frontend
        run: |
          nohup npm start > ../frontend.log 2>&1 &
          echo "FRONTEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for frontend
        run: |
          timeout 60 bash -c '
            until curl --silent --fail http://localhost:3000 > /dev/null; do
              sleep 2
            done
          '

      # ----- Run the suite ---------------------------------------------------
      - name: Run Playwright tests
        working-directory: e2e
        run: npm test

      # ----- Always-on diagnostics on failure --------------------------------
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-test-results
          path: e2e/test-results/
          retention-days: 14

      - name: Upload backend log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: backend-log
          path: backend.log
          retention-days: 7

      - name: Upload frontend log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-log
          path: frontend.log
          retention-days: 7

      - name: Stop background processes
        if: always()
        run: |
          if [ -n "${BACKEND_PID:-}" ]; then kill "$BACKEND_PID" 2>/dev/null || true; fi
          if [ -n "${FRONTEND_PID:-}" ]; then kill "$FRONTEND_PID" 2>/dev/null || true; fi
          docker compose -f docker-compose.db.yml down --volumes --remove-orphans || true
