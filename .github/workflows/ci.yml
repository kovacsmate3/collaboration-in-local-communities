name: CI

on:
  pull_request:
    branches: [main, development]

jobs:
  # ── Backend: lint + build + test + publish ─────────────────────────────────
  backend:
    name: Backend · Build / Test / Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore backend.Tests/backend.Tests.csproj

      # TreatWarningsAsErrors=true in Directory.Build.props means any StyleCop
      # or Roslyn analyzer violation fails this step.
      - name: Build
        run: dotnet build backend.Tests/backend.Tests.csproj --no-restore --configuration Release

      - name: Lint (format check)
        run: |
          dotnet format backend/backend.csproj --verify-no-changes --no-restore
          dotnet format backend.Tests/backend.Tests.csproj --verify-no-changes --no-restore

      - name: Test
        run: dotnet test backend.Tests/backend.Tests.csproj --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory backend.Tests/TestResults

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend.Tests/TestResults/**/coverage.cobertura.xml

      # Publish for the e2e job: reuses the build output from above (--no-build)
      # so no second compilation happens.
      - name: Publish
        run: dotnet publish backend/backend.csproj --no-restore --no-build --configuration Release -o backend-publish

      - name: Upload backend artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-publish
          path: backend-publish/
          retention-days: 1

  # ── Frontend: lint + typecheck + build + link check ────────────────────────
  frontend:
    name: Frontend · Lint / Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/**/*.js', 'frontend/**/*.jsx', 'frontend/**/*.ts', 'frontend/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-

      # npm run lint runs eslint --max-warnings=0, so any warning fails this step.
      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Start server
        run: |
          npm start &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for server
        run: timeout 30 sh -c 'until curl -sf http://localhost:3000 > /dev/null 2>&1; do sleep 1; done'

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --no-progress
            http://localhost:3000
            http://localhost:3000/login
            http://localhost:3000/register
          fail: true

      - name: Stop server
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true

      # The standalone server needs .next/static and public/ alongside server.js.
      # Embed them before uploading so the e2e job can run the server without npm.
      - name: Prepare standalone dist
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-standalone
          path: frontend/.next/standalone/
          retention-days: 1

  # ── E2E: full-stack Playwright ─────────────────────────────────────────────
  e2e:
    name: E2E · Playwright
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Backend bind address.
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://localhost:5073
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"

      # Postgres + Cosmos point at the docker-compose.db.yml services on localhost.
      ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=collab_dev;Username=postgres;Password=postgres"
      CosmosDb__AccountEndpoint: "https://localhost:8081/"
      CosmosDb__AccountKey: "C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw=="

      # JWT signing key — appsettings.Development.json has one too, but this
      # guarantees the >=32-byte minimum even if config gets overridden.
      Auth__SigningKey: "ci-e2e-only-auth-signing-key-32-byte-minimum"

      # SendGrid is validated at startup (ValidateOnStart) and requires a non-empty
      # ApiKey. The suite never sends mail, so a placeholder is sufficient.
      SendGrid__ApiKey: "ci-e2e-placeholder-sendgrid-api-key"

      # Frontend → backend proxy target and Playwright base URL.
      API_URL: "http://localhost:5073"
      BASE_URL: "http://localhost:3000"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: e2e/package-lock.json

      - name: Download backend artifact
        uses: actions/download-artifact@v8
        with:
          name: backend-publish
          path: backend-publish/

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-standalone
          path: frontend-standalone/

      # Start Cosmos emulator early — it takes 3-5 minutes on amd64.
      - name: Start backing services
        run: docker compose -f docker-compose.db.yml up -d

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      # Playwright docs explicitly recommend against caching browser binaries
      # ("restoration time equals download time"). Fresh install every run.
      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Wait for Postgres
        run: |
          timeout 120 bash -c '
            until docker compose -f docker-compose.db.yml exec -T db pg_isready -U postgres > /dev/null 2>&1; do
              sleep 2
            done
          '

      - name: Wait for Cosmos emulator
        run: |
          echo "Waiting for Cosmos emulator (typical: 3-5 minutes on amd64)..."
          timeout 600 bash -c '
            until curl -k --silent --output /dev/null --max-time 5 https://localhost:8081/_explorer/emulator.pem; do
              sleep 5
            done
          '

      - name: Start backend
        run: |
          nohup dotnet backend-publish/backend.dll > backend.log 2>&1 &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for backend
        run: |
          timeout 180 bash -c '
            until curl --silent --fail http://localhost:5073/health > /dev/null; do
              sleep 2
            done
          '

      # next.config.ts uses output:"standalone", so no node_modules needed at runtime.
      - name: Start frontend
        run: |
          PORT=3000 HOSTNAME=0.0.0.0 nohup node frontend-standalone/server.js > frontend.log 2>&1 &
          echo "FRONTEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for frontend
        run: |
          timeout 60 bash -c '
            until curl --silent --fail http://localhost:3000 > /dev/null; do
              sleep 2
            done
          '

      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test

      # Upload on success and failure, but not on manual cancel.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: e2e/test-results/
          retention-days: 14

      - name: Upload backend log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-log
          path: backend.log
          retention-days: 7

      - name: Upload frontend log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-log
          path: frontend.log
          retention-days: 7

      - name: Stop background processes
        if: always()
        run: |
          if [ -n "${BACKEND_PID:-}" ]; then kill "$BACKEND_PID" 2>/dev/null || true; fi
          if [ -n "${FRONTEND_PID:-}" ]; then kill "$FRONTEND_PID" 2>/dev/null || true; fi
          docker compose -f docker-compose.db.yml down --volumes --remove-orphans || true
